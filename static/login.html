<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录 - Mirr矩阵</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/assets/admin-nav.css" rel="stylesheet" />
    <style>
      .login-wrapper {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--space-6);
      }
      .login-box {
        width: 100%;
        max-width: 380px;
      }
      .login-brand {
        font-family: var(--font-display);
        font-size: 2rem;
        font-weight: 800;
        letter-spacing: -0.04em;
        color: var(--ink);
        line-height: 1;
      }
      .login-subtitle {
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: rgba(26, 20, 35, 0.5);
        margin-top: var(--space-2);
      }
      .login-card {
        background: var(--bg);
        border: var(--border);
        box-shadow: 6px 6px 0 var(--ink);
        border-radius: var(--radius);
        padding: var(--space-8);
      }
      .login-card .btn-primary {
        box-shadow: var(--shadow);
        padding: var(--space-3) var(--space-6);
        font-size: 1rem;
        font-weight: 700;
      }
      .login-card .btn-primary:hover {
        transform: translate(-1px, -1px);
        box-shadow: 5px 5px 0 var(--ink);
      }
      .login-footer {
        margin-top: var(--space-6);
        text-align: center;
        font-size: 0.6875rem;
        letter-spacing: 0.05em;
        color: rgba(26, 20, 35, 0.4);
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <div class="login-wrapper">
      <div class="login-box animate-fade-in-up">
        <div class="text-center mb-4">
          <div class="login-brand">Mirr矩阵</div>
          <div class="login-subtitle">矩阵工程管理后台</div>
        </div>

        <div class="login-card">
          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label">账号</label>
              <input class="form-control" name="username" autocomplete="username" required />
            </div>
            <div class="mb-3">
              <label class="form-label">密码</label>
              <input class="form-control" name="password" type="password" autocomplete="current-password" required />
            </div>
            <div class="mb-4 form-check">
              <input class="form-check-input" type="checkbox" id="rememberCredentials" checked />
              <label class="form-check-label" for="rememberCredentials">记住账号密码</label>
            </div>
            <button id="btnLogin" class="btn btn-primary w-100" type="submit">登录</button>
          </form>
        </div>

        <div class="login-footer">fpbrowser2api</div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
      import { setAdminToken, toast, getAdminProfile, isPageAllowed } from "/assets/app.js";

      const form = document.getElementById("loginForm");
      const btn = document.getElementById("btnLogin");
      const rememberEl = document.getElementById("rememberCredentials");
      const LOGIN_CACHE_KEY = "fpbrowser2api_login_cache_v1";

      function loadCachedCredentials() {
        try {
          const raw = localStorage.getItem(LOGIN_CACHE_KEY);
          if (!raw) return;
          const o = JSON.parse(raw);
          if (o && typeof o.username === "string") form.username.value = o.username;
          if (o && typeof o.password === "string") form.password.value = o.password;
          rememberEl.checked = true;
        } catch (_) {}
      }

      loadCachedCredentials();

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        btn.disabled = true;
        btn.textContent = "登录中...";
        try {
          const fd = new FormData(form);
          const r = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              username: fd.get("username"),
              password: fd.get("password"),
            }),
          });
          const d = await r.json();
          if (!r.ok) throw new Error(d.detail || "登录失败");
          if (rememberEl.checked) {
            localStorage.setItem(
              LOGIN_CACHE_KEY,
              JSON.stringify({
                username: String(fd.get("username") || ""),
                password: String(fd.get("password") || ""),
              }),
            );
          } else {
            localStorage.removeItem(LOGIN_CACHE_KEY);
          }
          setAdminToken(d.token);
          const me = await getAdminProfile(true);
          const order = ["system", "projects", "task_types", "tasks", "test", "card_keys", "logs", "users"];
          const pathMap = {
            system: "/admin/system",
            projects: "/admin/projects",
            task_types: "/admin/task-types",
            tasks: "/admin/tasks",
            test: "/admin/test",
            card_keys: "/admin/card-keys",
            logs: "/admin/logs",
            users: "/admin/users",
          };
          let target = "/admin/system";
          for (const key of order) {
            if (isPageAllowed(me, key)) {
              target = pathMap[key];
              break;
            }
          }
          window.location.href = target;
        } catch (err) {
          toast(err.message || "登录失败", "error");
        } finally {
          btn.disabled = false;
          btn.textContent = "登录";
        }
      });
    </script>
  </body>
</html>
